[package]
name = "dm-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dm-core = { version = "0.1.0", path = "../core" }
opendal = { version = "0.59.3", default-features = false, features = ["services-fs", "services-memory"] }
thiserror.workspace = true
time = { version = "0.3.55", features = ["serde-well-known", "formatting", "macros"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
