[package]
name = "dm-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dm-core = { version = "0.1.0", path = "../core" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
thiserror.workspace = true

# One of the two crates that may use `unsafe` (AGENTS.md): `pre_exec` runs between fork
# and exec, which is where namespaces and mounts have to happen. Every block carries a SAFETY comment and
# clippy's undocumented_unsafe_blocks is on. The rest mirrors the workspace lints.
[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
unwrap_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["sched", "mount", "user", "fs", "process", "hostname", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
