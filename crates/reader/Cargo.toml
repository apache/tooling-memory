[package]
name = "dm-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The core crate for a browser: entries, manifests and digests, parsed by the same code the server runs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dm-core = { version = "0.1.0", path = "../core" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
time = { version = "0.3.55", features = ["formatting"] }
wasm-bindgen = "0.2.129"

[lints]
workspace = true
