[package]
name = "amem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dm-client = { version = "0.1.0", path = "../client" }
dm-core = { version = "0.1.0", path = "../core" }
dm-egress = { version = "0.1.0", path = "../egress" }
dm-fetch = { version = "0.1.0", path = "../fetch" }
dm-index = { version = "0.1.0", path = "../index" }
dm-ledger = { version = "0.1.0", path = "../ledger" }
dm-mount = { version = "0.1.0", path = "../mount" }
dm-otel = { version = "0.1.0", path = "../otel" }
dm-policy = { version = "0.1.0", path = "../policy" }
dm-sandbox = { version = "0.1.0", path = "../sandbox" }
dm-server = { version = "0.1.0", path = "../server" }
dm-taps = { version = "0.1.0", path = "../taps" }
dm-web = { version = "0.1.0", path = "../web" }
dm-wslc-api = { version = "0.1.0", path = "../wslc-api" }
serde.workspace = true
serde_json = "1.0.151"
toml = "1.1.6"
url = "2.5.8"
time = { version = "0.3.55", features = ["formatting", "serde-well-known"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true

[dev-dependencies]
dm-ledger = { version = "0.1.0", path = "../ledger", features = ["pg-test"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.30"
tempfile = "3.27.0"
tokio-postgres = "0.7.18"
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["signal"] }
