[package]
name = "memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
dm-core = { version = "0.1.0", path = "../core" }
dm-index = { version = "0.1.0", path = "../index" }
dm-ledger = { version = "0.1.0", path = "../ledger" }
dm-server = { version = "0.1.0", path = "../server" }
serde.workspace = true
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "serde-well-known"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
