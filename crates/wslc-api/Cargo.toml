[package]
name = "dm-wslc-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A hand-made binding to the WSL containers C API (wslcsdk.dll), Windows only, loaded at run time"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

# One of the two crates that may use `unsafe` (AGENTS.md): it calls wslcsdk.dll through a
# binding made by hand from the SDK header. Every block carries a SAFETY comment and
# clippy's undocumented_unsafe_blocks is on. The rest mirrors the workspace lints.
[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
unwrap_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
