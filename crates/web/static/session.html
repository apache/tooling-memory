<script>
// an entry's body is anyone's text, an agent's or a bundle's: Markdown, with no styles,
// no forms and no remote images, so it can neither restyle the page around it nor call
// out from it
const SANITIZE = { FORBID_TAGS: ['style', 'form', 'input', 'button', 'textarea', 'select', 'option'], FORBID_ATTR: ['style'] };
DOMPurify.addHook('afterSanitizeAttributes', (n) => {
  if (n.tagName === 'IMG' && !/^data:image\//i.test(n.getAttribute('src') || '')) n.removeAttribute('src');
});
// ---- small DOM helpers: what the API says is only ever set as text ----
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, cls, ...kids) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const k of kids) if (k !== null && k !== undefined && k !== false) e.append(k);
  return e;
}
function glyph(name, label) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('class', 'am-glyph');
  if (label) { s.setAttribute('role', 'img'); s.setAttribute('aria-label', label); } else s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(NS, 'use');
  u.setAttribute('href', `#i-${name}`);
  s.append(u);
  return s;
}
const state = (tone, name, label) => el('span', `am-state am-state--${tone}`, glyph(name, label));
function chip(tone, name, word, count, extra) {
  const c = el('span', `am-chip am-chip--${tone}${extra ? ` ${extra}` : ''}`, glyph(name));
  if (count !== undefined) c.append(el('span', 'am-chip-count', String(count)));
  c.append(el('span', 'am-chip-word', word));
  c.title = count !== undefined ? `${count} ${word}` : word;
  return c;
}
const sub = (t) => el('span', 'am-sub', t);
const na = (t = 'not reported') => el('span', 'na', t);
const LABELS = ['public', 'internal', 'restricted'];
const TIERS = ['raw', 'curated', 'verified'];
const fact = (kind, order, word) => el('span', 'am-fact', glyph(`${kind}-${Math.max(0, order.indexOf(word))}`), word);
const abbrev = (n) => (n >= 10000 ? `${(n / 1000).toFixed(1)}k` : String(n));

// the session is ?id= in the address; the legacy /s/<id> was turned into it above
const id = new URLSearchParams(location.search).get('id') || '';

// ---- the terminal: its theme is the tokens, read again whenever the theme changes ----
const root = document.documentElement;
const css = () => getComputedStyle(root);
function termTheme() {
  const c = css();
  const t = (n) => c.getPropertyValue(`--am-term-${n}`).trim();
  const names = ['black', 'red', 'green', 'yellow', 'blue', 'magenta', 'cyan', 'white'];
  return {
    background: t('bg'), foreground: t('fg'), cursor: t('cursor'), cursorAccent: t('cursor-accent'), selectionBackground: t('selection'),
    ...Object.fromEntries(names.map((n) => [n, t(n)])),
    ...Object.fromEntries(names.map((n) => [`bright${n[0].toUpperCase()}${n.slice(1)}`, t(`bright-${n}`)])),
  };
}
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rem = parseFloat(css().fontSize) || 16;
const term = new Terminal({
  scrollback: 50000,
  fontSize: Math.round(rem * (parseFloat(css().getPropertyValue('--am-text-term')) || 0.875)),
  fontFamily: css().getPropertyValue('--am-font-mono').trim(),
  lineHeight: Number(css().getPropertyValue('--am-leading-term')) || 1.2,
  theme: termTheme(),
  minimumContrastRatio: 4.5,
  cursorBlink: !still,
  cursorStyle: 'block',
  screenReaderMode: false,
  allowProposedApi: true,
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open($('term'));
fit.fit();
term.focus();

function mermaidInit() {
  const c = css();
  const v = (n) => c.getPropertyValue(`--am-${n}`).trim();
  mermaid.initialize({
    startOnLoad: false, theme: 'base', securityLevel: 'strict',
    themeVariables: {
      primaryColor: v('surface'), primaryBorderColor: v('edge'), primaryTextColor: v('ink'), lineColor: v('muted'),
      secondaryColor: v('plate'), tertiaryColor: v('paper'), textColor: v('ink'), fontFamily: v('font-sans'),
    },
  });
}
mermaidInit();
function retheme() { term.options.theme = termTheme(); mermaidInit(); }
for (const q of ['(prefers-color-scheme: dark)', '(prefers-contrast: more)']) matchMedia(q).addEventListener('change', retheme);
new MutationObserver(retheme).observe(root, { attributes: true, attributeFilter: ['data-theme', 'data-contrast'] });

// ---- the bar: what the session was started with, then what the launcher says ----
let info = null;
let status = {};
function renderFacts() {
  const l = (info && info.launch) || {};
  const facts = [
    ['Harness', status.harness || l.harness],
    ['Model', status.model || l.model],
    ['Profile', l.profile],
  ].filter(([, v]) => v);
  $('facts').replaceChildren(...facts.map(([k, v]) => el('div', null, el('dt', null, k), el('dd', null, v))));
}
function setState(kind, code) {
  const s = $('status');
  if (kind === 'connecting' || kind === 'reconnecting') s.replaceChildren(chip('live', 'connecting', kind, undefined, 'am-chip--provisional'));
  else if (kind === 'running') s.replaceChildren(chip('live', 'running', 'running'));
  else if (kind === 'exited' && code === 0) s.replaceChildren(el('span', 'am-bar-state', state('ok', 'done'), 'exited 0'));
  else if (kind === 'exited') s.replaceChildren(chip('fail', 'fail', code === null || code === undefined ? 'exited' : `exited ${code}`));
  else if (kind === 'unpaired') s.replaceChildren(el('span', 'am-bar-state', state('await', 'pair'), 'not paired'));
  else s.replaceChildren(el('span', 'am-bar-state', state('fail', 'fail'), kind));
}
function notice(tone, glyphName, title, text, action) {
  const n = $('notice');
  const p = el('p', null, el('b', null, title), ' ', text);
  const box = el('div', `am-alert am-alert--${tone}`, glyph(glyphName), p);
  box.setAttribute('role', tone === 'fail' ? 'alert' : 'status');
  if (action) box.append(el('div', 'am-alert-act', action));
  n.replaceChildren(box);
  n.hidden = false;
}

// ---- the strip: what crosses the line, from the file the launcher writes ----
function renderStrip() {
  const s = status;
  const l = (info && info.launch) || {};
  const known = !!s.destination;
  const dest = $('s-dest');
  if (known) {
    dest.replaceChildren(s.destination, sub(s.auth || ''));
    if (s.metered === false) dest.append(sub('pinned, not metered'));
  } else dest.replaceChildren(l.provider || l.auth || na());
  const label = $('s-label');
  if (known && s.label && s.ceiling) {
    label.replaceChildren(fact('label', LABELS, s.label), sub(`of ${s.ceiling}`));
    label.title = s.ceiling_of ? `the ceiling grants.toml gives ${s.ceiling_of}` : '';
    if (LABELS.indexOf(s.label) >= LABELS.indexOf(s.ceiling)) label.append(chip('warn', 'ceiling', 'at ceiling'));
  } else label.replaceChildren(na());
  const usage = $('s-usage');
  const u = s.usage;
  if (known && s.metered !== false && u) {
    usage.replaceChildren(`${abbrev(u.input)} in, ${abbrev(u.output)} out`, sub(`${u.calls} call${u.calls === 1 ? '' : 's'}`));
    usage.title = `${u.input} tokens in, ${u.output} out, ${u.calls} calls`;
  } else usage.replaceChildren(na(known ? 'not reported: not metered' : 'not reported'));
  $('s-written').replaceChildren(known ? String(s.written ?? 0) : na());
  const h = $('s-handoffs');
  if (known && s.handoffs > 0) h.replaceChildren(chip('await', 'handoff', 'to read', s.handoffs));
  else h.replaceChildren(known ? '0' : na());
}
let statusTimer = null;
async function pollStatus() {
  const r = await amem.fetch(`/api/sessions/${encodeURIComponent(id)}/status`).catch(() => null);
  if (r && r.ok) {
    status = await r.json();
    renderStrip();
    renderFacts();
  }
}

// ---- the socket ----
let ws = null;
let exited = false;
let tries = 0;
function connect() {
  setState(tries ? 'reconnecting' : 'connecting');
  ws = amem.socket(`/ws/${encodeURIComponent(id)}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    tries = 0;
    setState('running');
    $('notice').hidden = true;
    term.reset();
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  };
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'exit') {
        exited = true;
        setState('exited', m.code);
        clearInterval(statusTimer);
        pollStatus();
      }
      return;
    }
    term.write(new Uint8Array(e.data));
  };
  ws.onclose = async () => {
    if (exited) return;
    // a refused upgrade looks like any closed socket; ask whether the page has a key
    const r = await amem.fetch(`/api/sessions/${encodeURIComponent(id)}`).catch(() => null);
    if (r && r.status === 401) { unpaired(); return; }
    if (r && r.status === 404) { missing(); return; }
    tries += 1;
    if (tries > 30) {
      setState('offline');
      const again = el('button', 'am-btn am-btn--secondary', 'Try again');
      again.type = 'button';
      again.addEventListener('click', () => { tries = 0; connect(); });
      notice('fail', 'fail', 'Cannot reach amem on this host.', 'The page tried for 30 seconds. The terminal holds what the session printed before the connection went; nothing has been lost from the session itself.', again);
      return;
    }
    setState('reconnecting');
    setTimeout(connect, 1000);
  };
}
term.onData((d) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'input', data: d })); });
term.onResize(({ cols, rows }) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'resize', cols, rows })); });
window.addEventListener('resize', () => fit.fit());

// what a page says when it has no key; a hosted copy also says where amem has to run
const unpairedWhy = () => { const w = amem.unpaired(); return amem.hosted && !/own machine/.test(w) ? `${w} This copy of the pages runs in your browser and talks to amem on your own machine: run amem there, and it opens this page paired.` : w; };
function unpaired() {
  setState('unpaired');
  const cmd = el('div', 'am-cmd', el('code', null, el('span', 'p', '$ '), 'amem'));
  notice('await', 'pair', 'Not paired.', unpairedWhy(), cmd);
  clearInterval(statusTimer);
}
function missing() {
  setState('no such session');
  const back = el('a', 'am-btn am-btn--secondary', 'All sessions');
  back.href = 'index.html';
  notice('fail', 'fail', 'No such session.', id ? 'This server has no session with that id. Sessions end with the server that started them.' : 'This address names no session.', back);
  clearInterval(statusTimer);
}

// ---- mem- ids in the terminal open in the pane ----
const ID = /mem-[a-z0-9]+-[a-z0-9]+/g;
term.registerLinkProvider({
  provideLinks(y, cb) {
    const line = term.buffer.active.getLine(y - 1);
    if (!line) return cb(undefined);
    const text = line.translateToString(true);
    const links = [];
    for (const m of text.matchAll(ID)) {
      links.push({ range: { start: { x: m.index + 1, y }, end: { x: m.index + m[0].length, y } }, text: m[0], activate: () => open(m[0], 'Opened from the terminal') });
    }
    cb(links.length ? links : undefined);
  },
});

// ---- the reading pane ----
let openId = null;
let unseen = 0;
async function open(entryId, why) {
  const r = await amem.fetch(`/api/entry/${encodeURIComponent(entryId)}`);
  if (!r.ok) return;
  const e = await r.json();
  openId = e.id;
  $('why').textContent = why;
  $('kind').textContent = e.type;
  $('ptitle').textContent = e.title;
  const meta = $('emeta');
  meta.replaceChildren(fact('label', LABELS, e.classification), fact('trust', TIERS, e.trust_tier), el('span', 'am-id', e.id), e.author ? el('span', null, e.author) : null);
  meta.hidden = false;
  const body = $('body');
  // an entry is somebody's Markdown: rendered, then stripped of scripts and handlers
  body.innerHTML = DOMPurify.sanitize(marked.parse(e.body), SANITIZE);
  const blocks = body.querySelectorAll('pre code.language-mermaid');
  for (const b of blocks) { const d = el('div', 'mermaid'); d.textContent = b.textContent; b.parentElement.replaceWith(d); }
  if (blocks.length) { try { await mermaid.run({ nodes: body.querySelectorAll('.mermaid') }); } catch (err) { console.warn(err); } }
  for (const a of $('recent').querySelectorAll('a')) {
    const on = a.dataset.id === openId;
    a.classList.toggle('is-open', on);
    if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  }
  if (why !== 'Opened from the recent list') $('live').textContent = `${why}: ${e.title}`;
  if ($('frame').dataset.tab === 'terminal' && narrow.matches) { unseen += 1; recordTab(); }
}
const seen = new Set();
let first = true;
async function poll() {
  try {
    const r = await amem.fetch('/api/entries');
    if (!r.ok) return;
    const list = await r.json();
    // titles are anyone's text, an agent's or a bundle's: set as text, never as markup
    $('recent').replaceChildren(...list.slice(0, 8).map((e) => {
      const a = el('a', e.id === openId ? 'is-open' : null, el('b', null, `${e.type}: `), e.title);
      a.href = `#${e.id}`;
      a.dataset.id = e.id;
      if (e.id === openId) a.setAttribute('aria-current', 'true');
      a.addEventListener('click', (ev) => { ev.preventDefault(); open(e.id, 'Opened from the recent list'); });
      return a;
    }));
    const fresh = list.filter((e) => !seen.has(e.id));
    list.forEach((e) => seen.add(e.id));
    if (!first && fresh.length) open(fresh[0].id, 'Landed during this session');
    first = false;
  } catch (e) { /* the server may be busy; try again */ }
}

// ---- tabs, below 720px: the terminal and the record ----
const narrow = matchMedia('(max-width: 720px)');
function recordTab() {
  const t = $('tab-record');
  t.replaceChildren('Record');
  if (unseen) t.append(chip('ink', 'entry', 'new', unseen));
}
function selectTab(which) {
  $('frame').dataset.tab = which;
  for (const [name, b] of [['terminal', $('tab-terminal')], ['record', $('tab-record')]]) {
    b.setAttribute('aria-selected', String(name === which));
    b.tabIndex = name === which ? 0 : -1;
  }
  if (which === 'record') { unseen = 0; recordTab(); } else requestAnimationFrame(() => { fit.fit(); term.focus(); });
}
$('tab-terminal').addEventListener('click', () => selectTab('terminal'));
$('tab-record').addEventListener('click', () => selectTab('record'));
for (const b of document.querySelectorAll('[role=tab]')) {
  b.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const next = $('frame').dataset.tab === 'terminal' ? 'record' : 'terminal';
    selectTab(next);
    $(`tab-${next}`).focus();
  });
}
narrow.addEventListener('change', () => requestAnimationFrame(() => fit.fit()));

// ---- F6 moves between the bar, the terminal and the pane: the terminal takes Tab ----
term.attachCustomKeyEventHandler((e) => e.key !== 'F6');
window.addEventListener('keydown', (e) => {
  if (e.key !== 'F6') return;
  e.preventDefault();
  const stops = [$('bar'), $('term').querySelector('textarea'), $('pane')];
  const at = stops.findIndex((s) => s && s.contains(document.activeElement));
  const next = stops[(at + (e.shiftKey ? stops.length - 1 : 1)) % stops.length];
  if (next === $('pane') && narrow.matches) selectTab('record');
  if (next !== $('pane') && narrow.matches && $('frame').dataset.tab === 'record') selectTab('terminal');
  next.focus();
});

// ---- start ----
async function start() {
  await amem.ready;
  renderStrip();
  if (!id) { missing(); return; }
  if (!amem.paired()) { unpaired(); return; }
  const r = await amem.fetch(`/api/sessions/${encodeURIComponent(id)}`).catch(() => null);
  if (r && r.status === 401) { unpaired(); return; }
  if (!r || r.status === 404) { missing(); return; }
  if (r.ok) {
    info = await r.json();
    $('title').textContent = info.title;
    document.title = `${info.title} · amem`;
    renderFacts();
    renderStrip();
  }
  connect();
  pollStatus();
  statusTimer = setInterval(pollStatus, 2000);
  poll();
  setInterval(poll, 2000);
}
start();
</script>
