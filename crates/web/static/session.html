<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memory session</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  :root { color-scheme: dark; --bg: #16181d; --fg: #e8e8e8; --muted: #9a9a9a; --line: #2b2f36; --accent: #6fb2ff; --pane: #1c1f26; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .bar a { color: var(--accent); text-decoration: none; }
  .bar .status { color: var(--muted); margin-left: auto; }
  .main { display: grid; grid-template-columns: 1fr minmax(320px, 42%); height: calc(100% - 34px); }
  #term { height: 100%; padding: 6px 0 6px 8px; box-sizing: border-box; }
  .pane { border-left: 1px solid var(--line); background: var(--pane); display: flex; flex-direction: column; min-width: 0; }
  .pane header { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .pane header b { color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane article { padding: 12px 16px; overflow: auto; flex: 1; line-height: 1.55; }
  .pane article pre { background: #0f1115; padding: 10px; border-radius: 6px; overflow: auto; }
  .pane article code { font-size: 13px; }
  .pane article .mermaid { background: #fff; border-radius: 6px; padding: 8px; }
  .pane .recent { padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); max-height: 120px; overflow: auto; }
  .pane .recent a { color: var(--accent); text-decoration: none; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 800px) { .main { grid-template-columns: 1fr; grid-template-rows: 1fr 40%; } .pane { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="bar"><a href="/">memory</a><span id="title"></span><span class="status" id="status">connecting</span></div>
<div class="main">
  <div id="term"></div>
  <aside class="pane">
    <header><span id="kind">reading pane</span><b id="ptitle">nothing opened yet</b></header>
    <article id="body">Entries the session writes open here as they land. Click a <code>mem-…</code> id in the terminal to open it.</article>
    <div class="recent" id="recent"></div>
  </aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.esm.min.mjs';
mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

const id = location.pathname.split('/').pop();
const status = document.getElementById('status');
const term = new Terminal({ scrollback: 50000, fontSize: 14, fontFamily: 'ui-monospace, Menlo, Consolas, monospace', theme: { background: '#16181d' }, allowProposedApi: true });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
term.focus();

let ws, closedByServer = false;
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/${id}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { status.textContent = 'connected'; term.reset(); ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows })); };
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.type === 'exit') { closedByServer = true; status.textContent = `exited ${m.code ?? '?'}`; }
      return;
    }
    term.write(new Uint8Array(e.data));
  };
  ws.onclose = () => { if (closedByServer) return; status.textContent = 'reconnecting'; setTimeout(connect, 1000); };
}
connect();
term.onData((d) => { if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'input', data: d })); });
term.onResize(({ cols, rows }) => { if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'resize', cols, rows })); });
window.addEventListener('resize', () => fit.fit());

// mem- ids in the terminal open in the pane
const ID = /mem-[a-z0-9]+-[a-z0-9]+/g;
term.registerLinkProvider({
  provideLinks(y, cb) {
    const line = term.buffer.active.getLine(y - 1);
    if (!line) return cb(undefined);
    const text = line.translateToString(true);
    const links = [];
    for (const m of text.matchAll(ID)) {
      links.push({ range: { start: { x: m.index + 1, y }, end: { x: m.index + m[0].length, y } }, text: m[0], activate: () => open(m[0]) });
    }
    cb(links.length ? links : undefined);
  }
});

// the reading pane
const seen = new Set();
let first = true;
async function open(entryId) {
  const r = await fetch(`/api/entry/${entryId}`);
  if (!r.ok) return;
  const e = await r.json();
  document.getElementById('kind').textContent = `${e.type} · ${e.classification} · ${e.trust_tier}`;
  document.getElementById('ptitle').textContent = e.title;
  const body = document.getElementById('body');
  body.innerHTML = marked.parse(e.body);
  const blocks = body.querySelectorAll('pre code.language-mermaid');
  for (const b of blocks) { const d = document.createElement('div'); d.className = 'mermaid'; d.textContent = b.textContent; b.parentElement.replaceWith(d); }
  if (blocks.length) { try { await mermaid.run({ nodes: body.querySelectorAll('.mermaid') }); } catch (err) { console.warn(err); } }
}
async function poll() {
  try {
    const r = await fetch('/api/entries');
    const list = await r.json();
    const recent = document.getElementById('recent');
    recent.innerHTML = list.slice(0, 8).map(e => `<a href="#" data-id="${e.id}">${e.type}: ${e.title}</a>`).join('');
    recent.querySelectorAll('a').forEach(a => a.onclick = (ev) => { ev.preventDefault(); open(a.dataset.id); });
    const fresh = list.filter(e => !seen.has(e.id));
    list.forEach(e => seen.add(e.id));
    if (!first && fresh.length) open(fresh[0].id);
    first = false;
  } catch (e) { /* the server may be busy; try again */ }
}
poll(); setInterval(poll, 2000);
fetch(`/api/sessions/${id}`).then(r => r.json()).then(s => { document.getElementById('title').textContent = s.title; document.title = `memory · ${s.title}`; });
</script>
</body>
</html>
