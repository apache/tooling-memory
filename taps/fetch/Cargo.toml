[package]
name = "tap-fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A tool tap: one web page, fetched for an agent and returned as text"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasi = "0.14"
wit-bindgen = "0.62"
