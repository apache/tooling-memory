[package]
name = "tap-github-issues"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A tap: open GitHub issues become proposed tasks on the owning domain's ledger"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasi = "0.14"
wit-bindgen = "0.62"
