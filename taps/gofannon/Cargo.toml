[package]
name = "tap-gofannon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A tool tap: Gofannon's deployed agents, listed, started, and read back, for an agent"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasi = "0.14"
wit-bindgen = "0.62"
