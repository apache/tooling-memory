[package]
name = "tap-search"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A tool tap: a web search for an agent, returned as a list of hits"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasi = "0.14"
wit-bindgen = "0.62"
