# Golden questions over the documents in docs/, seeded as the demo corpus by
# scripts/seed-corpus.py, one entry per section. Answers name section titles, or parts
# of them; any one is a hit. `keywords` is the query a person would write, standing in
# for the one a model writes. Run: amem golden golden/docs.toml
#
# Add your own domain's suite beside this one; the format is the same.

domain = "dom-demo"

[[question]]
ask = "What does the recall deputy do, and why can a low-privilege caller not launder reads through it?"
answers = ["The recall deputy"]
keywords = "recall deputy brief caller filter"

[[question]]
ask = "Who pays for recall at a foundation, and which principals get it server-side?"
answers = ["Serving and who pays"]
keywords = "recall committer server-side budget"

[[question]]
ask = "Why is the domain the partition key everywhere?"
answers = ["the domain is the partition key"]
keywords = "domain partition key"

[[question]]
ask = "What label does an entry get when a session writes after reading restricted material?"
answers = ["Labels and flow"]
keywords = "write label rises restricted classification"

[[question]]
ask = "What happens when an entry must be erased, and what remains in its place?"
answers = ["Erasure"]
keywords = "erasure stub receipt"

[[question]]
ask = "How is a wrong or compromised curator contained?"
answers = ["Containing the Curator"]
keywords = "curator contain auditors reversible diff"

[[question]]
ask = "Which three uses does WebAssembly have in the stack?"
answers = ["WebAssembly, split into three uses"]
keywords = "WebAssembly three uses"

[[question]]
ask = "Where does latency on the hot path come from?"
answers = ["Latency on the hot path"]
keywords = "latency hot path"

[[question]]
ask = "What does the policy stack look like for a federation of projects?"
answers = ["A policy stack for a federation"]
keywords = "policy stack federation"

[[question]]
ask = "What do the trust tiers mean?"
answers = ["Four questions, four labels", "The record and its rules", "Words you'll hear"]
keywords = "trust tier raw curated verified"

[[question]]
ask = "How does an entry move from one trust tier to the next?"
answers = ["Promotion"]
keywords = "raw curated promotion tier"

[[question]]
ask = "How does the read path start small, with summaries before bodies?"
answers = ["Disposable Agents: Search"]
keywords = "search read path summary get"

[[question]]
ask = "How does the system detect a vendor changing a model behind a stable name?"
answers = ["Vendor changes nobody announced"]
keywords = "vendor model probe detector drift"

[[question]]
ask = "What can a task's requirements field be abused for, and what guards it?"
answers = ["A task's life"]
keywords = "task requirements guard admission"

[[question]]
ask = "Which sources become entries at the foundation, and how do they get there?"
answers = ["Sources to entries"]
keywords = "sources entries lists commits issues taps"
