name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Whether this push or pull request changes only Markdown outside the code, which cannot
  # change what builds (scripts/docs-only.sh says which files those are). The jobs below skip on a yes; a job skipped by its
  # condition reports success, so a required check does not sit waiting for it. Anything
  # the diff cannot answer, a first push or a rewritten base, runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # judged by the base's copy of the script, so a change to it cannot skip the
          # job that tests it; a base without one runs everything
          if judge=$(git show "$BASE:scripts/docs-only.sh") &&
              files=$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA") &&
              printf '%s\n' "$files" | sh -c "$judge"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "only Markdown changed; the build and test jobs skip"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # The pre-commit gate, as `make check` runs it locally, plus the two checks that need
  # cargo extensions. Actions are pinned by commit; the comment says which release.
  check:
    name: check (linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-wasip2, x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make check
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-machete
      - run: make machete

  # The same tests on Windows. Portability between the two is a stated goal, so a change
  # that passes on one and not the other does not merge.
  windows:
    name: test (windows)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-10
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

  # dm-core and dm-policy must build for the browser, or the reader cannot.

  macos:
    name: test (macos)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-10
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

  # dm-core must build for the browser, or the reader and the plugins cannot.
  wasm:
    name: build (wasm32)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-10
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make wasm-check

  # Advisories, licences, duplicate versions, sources. Configured in deny.toml.
  deny:
    name: dependencies
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Line coverage against COVERAGE_MIN in the Makefile, which is a ratchet. The lcov
  # report is attached to the run for anyone who wants to look at the lines.
  coverage:
    name: coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-10
        with:
          toolchain: stable
          components: llvm-tools-preview
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - run: make coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: target/lcov.info

  # The browser tests: the pages driven by Chromium in the Playwright image, as
  # `make e2e` runs them, with every page's screenshots attached to the run for review.
  e2e:
    name: e2e (chromium)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make e2e
        env:
          CI: 'true'
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: |
            e2e/screenshots/
            e2e/playwright-report/
          retention-days: 14
