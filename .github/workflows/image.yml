# The harness image: built when its inputs change, to show the Dockerfile still builds, and
# never published; machines build their own with `make image`. Pins are bumped by a daily
# check that opens a pull request. Never on a run: `memory launch` uses the tag it is given.
name: image

on:
  push:
    branches: [main]
    paths: ["images/harness/**", "crates/**", "Cargo.*", ".github/workflows/image.yml"]
  schedule:
    - cron: "41 5 * * *"   # daily pin check
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Daily: bump the pins and open (or update) a pull request. CI runs on it like any PR
  # once a person approves the workflow run, since it is opened with the workflow token.
  bump:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Bump pins
        id: bump
        run: |
          changes=$(scripts/bump-harness-versions.sh)
          echo "$changes"
          { echo "changes<<EOF"; echo "$changes"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Open a pull request
        if: steps.bump.outputs.changes != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "harness-image bot"
          git config user.email "noreply@github.com"
          git checkout -B bot/harness-pins
          git add images/harness/Dockerfile
          git commit -m "image: bump harness pins" -m "${{ steps.bump.outputs.changes }}"
          git push -f origin bot/harness-pins
          gh pr create --fill --base main --head bot/harness-pins \
            --title "image: bump harness pins" \
            --body "$(printf 'Daily pin check.\n\n%s' "${{ steps.bump.outputs.changes }}")" \
            || gh pr edit bot/harness-pins --body "$(printf 'Daily pin check.\n\n%s' "${{ steps.bump.outputs.changes }}")"

  # On a change to the inputs: build with the release binary, to show the image still
  # builds. Nothing is pushed.
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 2026-07-16, the commit the ASF allow-list pins
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the memory binary
        run: cargo build --release --locked -p amem && cp target/release/amem images/harness/memory
      - name: Build the image
        run: docker build --pull -t harness:${{ github.sha }} images/harness
