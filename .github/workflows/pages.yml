name: Hosted pages

# The pages as plain files on GitHub Pages, for `amem --hosted <url>`. Run by hand only:
# publishing is a decision, not a side effect of a merge. Needs Pages enabled with
# "GitHub Actions" as the source in the repository's settings, and a custom domain: the
# copy needs an origin of its own, and user.github.io is shared by every site of the
# account (local/README.md, "A hosted page").
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/hosted.sh _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
