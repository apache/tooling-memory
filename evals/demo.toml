# An evaluation set over the demo record: questions whose answers live in the record and
# nowhere else, so a harness without memory can only guess. `scripts/eval.py` runs each
# task under each condition and grades the answer against `expect`, a case-insensitive
# regular expression that the answer must match.
#
#   scripts/eval.py evals/demo.toml --root ~/memory-demo2 --harness claude --auth subscription
#   scripts/eval.py evals/demo.toml --root ~/memory-demo2 --harness codex --auth gateway --model qwen3.8-27b
#
# Seed a fresh record first. An existing record keeps the text it was seeded with, and
# RESET=1 removes the whole root:
#
#   make demo-ready RESET=1 DEMO_ROOT=$HOME/memory-demo2

# Put in front of every prompt, under every condition alike. A harness given a memory
# server does not always think to ask it; a task run says so in its prompt, and so does
# this. The bare harness reads the same sentence and has nothing to ask.
preamble = "If a memory server is attached to this session, search it and read its T0 before answering; it holds what you need. "

[[task]]
id = "dr19-decision"
prompt = "What did DR-19 decide about the wiki staying on MoinMoin? Answer in one or two sentences from what you know; do not browse the web."
# "no decision" alone also matches a refusal ("no decision entries recorded"), so only
# the record's own answer counts: proposed, not yet taken, no final decision
expect = "(not (yet )?(been )?taken|no final decision|(hasn't|has not) (yet )?(made|taken|reached) a (final )?decision|not (yet )?decided|still open|stays on MoinMoin|proposed)"

[[task]]
id = "dr19-spike"
prompt = "Which spike in the work plan would settle DR-19, the question of whether the wiki stays on MoinMoin? Name it. Do not browse the web."
expect = "S2"

[[task]]
id = "asf-pressures"
prompt = "In the 'Seeding a Foundation' notes, how many pressures does the part 'What the Foundation taught the design' list? Give the number."
# the part cites "paper §6" and another part is "6. Trust and review", so a six or 6
# counts unless it is a section number, a link anchor, or the end of a range or a list of
# parts. The table in part 6 also has six rows, so a model that counts the wrong table
# passes too; no pattern can tell
expect = "(?<![§#–-])(?<!§ )(?<!section )(?<!part )\\b(six|6)\\b(?![–-])(?!\\s*[.)]?\\s*trust)"

[[task]]
id = "committers-gate"
prompt = "In the 'Seeding a Foundation' notes on trust and review, who is the promotion gate? One sentence."
# the gate is named people that domain policy authorises, under PMC oversight; the case
# study gives committers sampled review, so "committers" is no longer the answer, and
# "the PMC" is what a model guesses about Apache with no record at all. The policy must be
# the domain's, or one that authorises the people; "named people under the release
# policy" names the wrong one
expect = "named[*_ ]+(people|persons?|individuals?|reviewers?|approvers?|maintainers|humans?)[^.]{0,40}authori[sz]\\w*[^.]{0,25}\\bpolicy|named[*_ ]+(people|persons?|individuals?|reviewers?|approvers?|maintainers|humans?)[^.]{0,40}\\bdomain(['’]s)?[*_]* (memory )?policy|(people|persons?|individuals?|reviewers?|approvers?|maintainers|humans?)\\b[^.]{0,40}\\bdomain(['’]s)?[*_]* policy[^.]{0,15}authori[sz]|(people|persons?|individuals?|reviewers?|approvers?|maintainers|humans?)\\b[^.]{0,30}authori[sz]ed by [*_]*(the )?domain(['’]s)?[*_]* policy|policy-authori[sz]ed (people|persons?|individuals?|reviewers?|approvers?|maintainers|humans?)"
